<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM PRACTICE</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
   <form action="/server">
    <div>
    <label for="ap">Username:</label>   
    <input type="text" placeholder="Enter Username" id="ap" name="query" />
    </div>
    <br/>
    <div>
    <label for="sp">Password:</label>
    <input type="password"  placeholder="Enter password" id="sp" name="password"/>
    </div>
    <br/>
    <div>
    <label for="kp">Number:</label>
    <input type="number" placeholder="Enter Number" id="kp"  name="number"/>
    </div>
    <button>Submit</button>
   </form> 
   <form action="https://www.youtube.com/results">
   <input type="text" placeholder="search in youtube" name="search_query"> 
   <button>search</button>
   </form>
  <br>
   <form action="https://www.google.com/search">
   <input type="text" placeholder="search in google" name="q" >
   <button>search</button>
   </form>

</body>
</html>
