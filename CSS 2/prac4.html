<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Checkbox in Form </title>
</head>
<body>
<form action="server\">
<input type="checkbox" id="age" name="age">
<label for="age">I am 18+</label> 
<button>submit</button>  
</form>  

<br>

<form>
    <div>
    <input type="radio" id="mango" name="fruit">
    <label for="mango">Mango</label>
    <br>
    <input type="radio" id="apple" name="fruit">
    <label for="apple" >Apple</label>
    <input type="radio" id="banana" name="fruit">
    <label for="banana" >Banana</label>
    <button>submit</button>
    </div>
<din>
    select your profession
    <select type="checkbox" name="profession" id="pro">
    <option id="std" value="student" selected >student</option>
    <option id="tea" value="teacher">Teacher</option>
    <option id="eng" value="Engineer">Engineer</option>
    </select>
    <label for="val">Select your volume level: </label>
    <input type="range" id="val" min="0" max="100" step="20" value="90" name="val">
    <br>
    <label for="feedback">Please give your valuable feedback : </label>
    <textarea id="feedback" name="feedback"></textarea>
</din>

</form>
</body>
</html>
